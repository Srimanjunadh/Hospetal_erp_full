version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pms-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  gateway:
    build:
      context: .
      dockerfile: microservices/gateway/Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////workspace/data/gateway.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./backend/app:/workspace/app
      - db-data-dev:/workspace/data
    depends_on:
      - rabbitmq

  identity-service:
    build:
      context: .
      dockerfile: microservices/identity/Dockerfile
      target: development
