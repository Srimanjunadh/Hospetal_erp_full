apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: medclues
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: medclues/gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: medclues-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: medclues
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: gateway

