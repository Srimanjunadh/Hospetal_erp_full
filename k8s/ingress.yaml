apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medclues-ingress
  namespace: medclues
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - api.medclues.com
    secretName: medclues-tls-secret
  rules:
  - host: api.medclues.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8000
